<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STJ — Primeira Turma e Primeira Seção | Caderno de Sessões (GMHB)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231b365d' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3v18'/><path d='M5 7h14'/><path d='m5 7-3 7h6l-3-7Z'/><path d='m19 7-3 7h6l-3-7Z'/><path d='M8 21h8'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="#mainWorkspace" class="skip-link">Pular para o conteúdo principal</a>

    <div class="app-shell">
        <!-- Backdrop para Menu Mobile -->
        <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>

        <!-- Barra Lateral: Navegação de Sessões e Busca Global -->
        <aside class="sidebar" id="sidebar" aria-label="Navegação de sessões">
            <div class="sidebar-top">
                <div class="institutional-brand">
                    <div class="brand-emblem" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3v18"></path>
                            <path d="M4 7h16"></path>
                            <path d="m5 7-3 7h6l-3-7Z"></path>
                            <path d="m19 7-3 7h6l-3-7Z"></path>
                            <path d="M8 21h8"></path>
                        </svg>
                    </div>
                    <div class="brand-titles">
                        <span class="brand-kicker">Superior Tribunal de Justiça</span>
                        <h1 class="brand-heading">Caderno de Sessões</h1>
                        <span class="brand-subtitle">1ª Turma e 1ª Seção · GMHB</span>
                    </div>
                </div>

                <!-- Busca Global Profunda -->
                <div class="global-search-box" role="search">
                    <label class="sr-only" for="searchInput">Buscar processos, teses, matérias ou manifestações</label>
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                        <circle cx="11" cy="11" r="7.5"></circle>
                        <path d="m20 20-3.8-3.8"></path>
                    </svg>
                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Buscar processo, tese, relator…"
                        autocomplete="off"
                    >
                    <kbd class="search-kbd" aria-hidden="true">Ctrl+K</kbd>
                </div>

                <!-- Seletor de Órgão Colegiado -->
                <div class="orgao-tabs" role="tablist" aria-label="Filtrar por órgão colegiado">
                    <button type="button" class="orgao-tab active" data-orgao="todos" role="tab" aria-selected="true">Todos</button>
                    <button type="button" class="orgao-tab" data-orgao="primeira_turma" role="tab" aria-selected="false">1ª Turma</button>
                    <button type="button" class="orgao-tab" data-orgao="primeira_secao" role="tab" aria-selected="false">1ª Seção</button>
                </div>

                <div class="sidebar-status-bar">
                    <span id="resultsInfo" class="results-count" aria-live="polite">0 sessões</span>
                    <button type="button" id="resetAllFiltersBtn" class="link-reset-btn" hidden>Limpar filtros</button>
                </div>
            </div>

            <nav class="sessions-nav" id="sessionsList" aria-label="Sessões disponíveis">
                <!-- Preenchido via app.js -->
            </nav>

            <div class="sidebar-footer">
                <button type="button" id="themeToggle" class="theme-btn" aria-pressed="false">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" hidden>
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                    <span id="themeLabel">Modo escuro</span>
                </button>
            </div>
        </aside>

        <!-- Área Principal -->
        <div class="main-area" id="mainWorkspace">
            <!-- Barra Superior Fixa -->
            <header class="topbar">
                <div class="topbar-left">
                    <button type="button" id="mobileMenuBtn" class="icon-button mobile-only" aria-label="Abrir lista de sessões" aria-expanded="false">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div id="topbarSessionMeta" class="topbar-session-meta">
                        <span class="topbar-orgao-badge">Direito Público — STJ</span>
                        <h2 class="topbar-title">Selecione uma sessão</h2>
                    </div>
                </div>

                <div class="topbar-actions" id="topbarActions">
                    <!-- Links de Vídeo (YouTube) -->
                    <div id="videoActionsGroup" class="action-group"></div>

                    <!-- Ler Transcrição Revisada no Navegador -->
                    <button type="button" id="readTranscriptBtn" class="btn-action" hidden>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <line x1="10" y1="9" x2="8" y2="9"></line>
                        </svg>
                        <span>Transcrição</span>
                    </button>

                    <!-- Baixar Transcrição Formatada em Word (.docx) -->
                    <a id="downloadTranscriptBtn" class="btn-action btn-action--primary" href="#" download hidden title="Baixar transcrição completa formatada para Microsoft Word (.docx)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        <span>Baixar .docx</span>
                    </a>

                    <!-- Copiar Resumo Markdown -->
                    <button type="button" id="copySummaryBtn" class="btn-action btn-action--collapsible" title="Copiar resumo em Markdown">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span id="copySummaryLabel">Copiar resumo</span>
                    </button>

                    <!-- Imprimir / Salvar PDF -->
                    <button type="button" id="printBtn" class="btn-action btn-action--collapsible" title="Imprimir pauta resumida">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                            <polyline points="6 9 6 2 18 2 18 9"></polyline>
                            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                            <rect x="6" y="14" width="12" height="8"></rect>
                        </svg>
                        <span>Imprimir</span>
                    </button>
                </div>
            </header>

            <!-- Barra de Filtros de Julgados (Matérias do Gabinete, Relator e Destaques) -->
            <section class="filters-toolbar" aria-label="Filtros de processos">
                <div class="filters-row">
                    <!-- Seletor das 15 Matérias do Gabinete -->
                    <div class="filter-control">
                        <label for="materiaSelect" class="filter-label sr-only">Matéria (Gabinete)</label>
                        <select id="materiaSelect" class="filter-select">
                            <option value="">Todas as 15 matérias</option>
                        </select>
                    </div>

                    <!-- Seletor de Relator (Titulares + Categoria Flexível de Convocados/Substitutos) -->
                    <div class="filter-control">
                        <label for="relatorSelect" class="filter-label sr-only">Relator / Julgador</label>
                        <select id="relatorSelect" class="filter-select">
                            <option value="">Todos os julgadores</option>
                        </select>
                    </div>

                    <!-- Filtros Rápidos Tipográficos -->
                    <div class="quick-toggles" role="group" aria-label="Recortes rápidos">
                        <button type="button" id="toggleHermanBtn" class="toggle-pill" aria-pressed="false">
                            <span class="pill-indicator pill-indicator--herman"></span>
                            <span>Min. Herman Benjamin</span>
                        </button>
                        <button type="button" id="toggleRelevantBtn" class="toggle-pill" aria-pressed="false">
                            <span class="pill-indicator pill-indicator--relevant"></span>
                            <span>Casos relevantes</span>
                        </button>
                        <button type="button" id="toggleThesisBtn" class="toggle-pill" aria-pressed="false">
                            <span class="pill-indicator pill-indicator--thesis"></span>
                            <span>Com tese fixada</span>
                        </button>
                    </div>

                </div>

                <!-- Faixa de Tags de Matérias presentes na sessão ativa -->
                <div id="sessionMateriaChips" class="materia-chips-bar" aria-label="Matérias na sessão atual"></div>
            </section>

            <!-- Conteúdo Rolável da Sessão -->
            <main class="content-scroll" id="documentViewer" tabindex="-1">
                <!-- Renderizado dinamicamente via app.js -->
            </main>

            <!-- Botão Voltar ao Topo -->
            <button type="button" id="backToTopBtn" class="back-to-top-btn" aria-label="Voltar ao topo da página" title="Voltar ao topo" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <!-- Leitor Taquigráfico Imersivo e Saneado -->
    <div id="transcriptDrawerBackdrop" class="drawer-backdrop" hidden></div>
    <aside id="transcriptDrawer" class="transcript-drawer" aria-labelledby="transcriptDrawerTitle" aria-hidden="true" hidden>
        <header class="drawer-header">
            <div class="drawer-title-group">
                <span class="drawer-kicker">Transcrição revisada</span>
                <h2 id="transcriptDrawerTitle" class="drawer-title">Transcrição da Sessão</h2>
            </div>
            <div class="drawer-actions">
                <!-- Controle de Fonte A- / A+ -->
                <div class="font-size-controls" role="group" aria-label="Ajuste do tamanho do texto">
                    <button type="button" id="transcriptFontDec" class="btn-subtle btn-subtle--sm" title="Diminuir tamanho da fonte">A-</button>
                    <button type="button" id="transcriptFontInc" class="btn-subtle btn-subtle--sm" title="Aumentar tamanho da fonte">A+</button>
                </div>

                <!-- Alternador de Modo: Diálogo vs Texto Contínuo -->
                <div class="transcript-view-toggle" role="group" aria-label="Modo de exibição da transcrição">
                    <button type="button" id="transcriptModeDialogue" class="toggle-mode-btn active" title="Visualização em balões de diálogo por orador">Diálogo</button>
                    <button type="button" id="transcriptModeContinuous" class="toggle-mode-btn" title="Visualização contínua taquigráfica">Texto contínuo</button>
                </div>

                <!-- Botão Tela Cheia -->
                <button type="button" id="fullscreenTranscriptBtn" class="icon-button" title="Alternar tela cheia" aria-label="Alternar tela cheia">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <polyline points="9 21 3 21 3 15"></polyline>
                        <line x1="21" y1="3" x2="14" y2="10"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                    <svg class="icon-compress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" hidden>
                        <polyline points="4 14 10 14 10 20"></polyline>
                        <polyline points="20 10 14 10 14 4"></polyline>
                        <line x1="14" y1="10" x2="21" y2="3"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                </button>

                <!-- Baixar Transcrição Formatada em Word (.docx) -->
                <a id="drawerDownloadBtn" class="btn-action btn-action--primary" href="#" download title="Baixar transcrição completa formatada para Microsoft Word (.docx)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span>Baixar .docx</span>
                </a>

                <!-- Fechar -->
                <button type="button" id="closeTranscriptDrawerBtn" class="icon-button" aria-label="Fechar transcrição" title="Fechar (Esc)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Barra de Ferramentas e Filtros da Transcrição -->
        <div class="drawer-toolbar">
            <div class="drawer-search-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                    <circle cx="11" cy="11" r="7.5"></circle>
                    <path d="m20 20-3.8-3.8"></path>
                </svg>
                <input type="search" id="transcriptSearchInput" placeholder="Buscar falas, votos ou palavras-chave na transcrição..." autocomplete="off">
                <span id="transcriptMatchCount" class="transcript-match-count" aria-live="polite"></span>
            </div>

            <!-- Filtros de Oradores -->
            <div class="speaker-filter-pills" role="group" aria-label="Filtrar por interlocutor">
                <button type="button" class="speaker-pill active" data-speaker="todos">Todos</button>
                <button type="button" class="speaker-pill speaker-pill--herman" data-speaker="herman">Min. Herman Benjamin</button>
                <button type="button" class="speaker-pill" data-speaker="presidente">Presidência</button>
                <button type="button" class="speaker-pill" data-speaker="relator">Relatores</button>
            </div>
        </div>

        <div id="transcriptDrawerBody" class="drawer-body" data-font-size="15"></div>
    </aside>

    <!-- Movido pelo app.js para o cabeçalho da lista de processos -->
    <button type="button" id="toggleAllDetailsBtn" class="btn-subtle" hidden>Recolher discussões</button>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
